[package]
name = "huginn-script"
description = "Runs the Huginn SP1 program in execute mode (cycle counts) or proves it."
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: sp1-sdk is large, and the main workspace shouldn't build it.
[workspace]

[dependencies]
sp1-sdk = "=6.10.0"
tokio = { version = "1", features = ["full"] }
alpenglow-core = { path = "../../crates/alpenglow-core", features = ["fixture"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[build-dependencies]
sp1-build = "=6.10.0"
