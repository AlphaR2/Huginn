[package]
name = "huginn-program"
description = "SP1 guest: proves a Solana block is final (Alpenglow certificate) and that given shreds are its contents."
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: compiled by `cargo prove` for the zkVM's RISC-V target.
[workspace]

[dependencies]
sp1-zkvm = "=6.10.0"
alpenglow-core = { path = "../../crates/alpenglow-core" }

# SP1 precompiles for BLS12-381 and SHA-256. Tags from SP1 v6.10.0's own examples/Cargo.toml.
[patch.crates-io]
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.10.0" }
sha2-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.10.0" }
