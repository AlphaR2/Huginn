[workspace]
resolver = "2"
members = ["crates/alpenglow-core", "crates/alpenglow-lc", "crates/fetch", "crates/ledger-dump"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
# Pinned exactly. Bump together and log in docs/research/findings.md.
agave-bls-cert-verify = { version = "=4.4.0", features = ["agave-unstable-api"] }
agave-votor-messages = { version = "=4.4.0", features = ["agave-unstable-api"] }
solana-hash = "=4.7.0"
solana-bls-signatures = "=4.0.2"
# Only for tests that check alpenglow-core's transaction parser against Agave's.
solana-transaction = { version = "=5.1.0", features = ["wincode"] }
solana-message = { version = "=5.1.0", features = ["wincode"] }
wincode = "=0.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
anyhow = "1"

# alpenglow-core uses SP1's patched bls12_381 natively too, so native tests and the zkVM
# compile the same source. Off the zkVM target it is plain Rust (sp1-lib is zkvm-only).
[patch.crates-io]
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.10.0" }
