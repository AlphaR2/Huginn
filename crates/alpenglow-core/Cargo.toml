[package]
name = "alpenglow-core"
description = "Alpenglow finality and block_id checks in pure Rust (no Agave, no C), so they run inside the SP1 zkVM."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
# SP1 accelerates exactly this crate and version (sp1-patches/bls12_381, patch-0.8.0-sp1-6.10.0).
# `experimental` = hash_to_curve, which takes a digest-0.9 hasher, hence sha2 0.9 below.
bls12_381 = { version = "=0.8.0", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
sha2-09 = { package = "sha2", version = "0.9", default-features = false }
sha2.workspace = true
thiserror.workspace = true
serde.workspace = true
# Feature `fixture`: build inputs from JSON fixtures or synthetic sets (host side only).
serde_json = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
fixture = ["dep:serde_json", "dep:hex"]

[dev-dependencies]
alpenglow-core = { path = ".", features = ["fixture"] }
serde_json.workspace = true
